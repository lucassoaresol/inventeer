[mcp_servers.apex]
url = "https://apex-gw.dev.inventeer.tech/api/v1/mcp"
enabled = true
default_tools_approval_mode = "writes"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
enabled = true
default_tools_approval_mode = "prompt"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
http_headers = { "X-MCP-Toolsets" = "pull_requests,repos,actions,git", "X-MCP-Readonly" = "true" }
enabled = true
default_tools_approval_mode = "writes"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]
cwd = "repos/portal-web"
enabled = true
default_tools_approval_mode = "writes"
